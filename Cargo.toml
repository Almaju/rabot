[package]
name = "rabot"
version = "0.1.4"
edition = "2024"
default-run = "rabot"
description = "A linter and formatter that enforces the principles of https://almaju.github.io/blog/ on Rust code"
license = "MIT"
repository = "https://github.com/almaju/rabot"
keywords = ["lint", "formatter", "style", "architecture"]
categories = ["development-tools"]
exclude = ["tests/fixtures/lint/Cargo.toml"]

# `cargo binstall rabot` finds the release archives without compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rabot-v{ version }-{ target }{ archive-suffix }"
bin-dir = "rabot-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syn = { version = "2", features = ["full", "extra-traits", "visit", "printing"] }
thiserror = "2"
toml = "0.8"
