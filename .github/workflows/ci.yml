name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: rabot on rabot
        run: |
          cargo run -q -- fmt --check src
          cargo run -q -- check --strict src

  # Run the published action from this checkout, exactly as a downstream
  # workflow would. GitHub parses action.yml, install.sh fetches the latest
  # release, and the composite steps lint this repository with the defaults.
  # It tests the action wrapper, not this commit's Rust code; the job above
  # covers that.
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
