name: Release

# Pushing a tag `v*`, or dispatching this workflow with a tag name, builds
# rabot for every supported platform and attaches the archives to a GitHub
# release, which is what install.sh downloads. A dispatched run creates the
# tag on the commit it was started from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0 (must match Cargo.toml's version)"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: tag matches Cargo.toml
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$VERSION" = "v$crate" ] || { echo "tag $VERSION does not match Cargo.toml version $crate" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          name="rabot-$VERSION-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rabot target/${{ matrix.target }}/release/cargo-rabot README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rabot-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/rabot.exe, target/${{ matrix.target }}/release/cargo-rabot.exe, README.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            rabot-*.tar.gz
            rabot-*.tar.gz.sha256
            rabot-*.zip
            rabot-*.zip.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
